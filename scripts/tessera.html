<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Tessera Fan Club Luca Lunetta #32</title>
<!-- Sorgente delle due immagini della tessera (public/img/tessera-fronte e tessera-retro).
     Si rigenerano con: node scripts/tessera.mjs
     Colori, font, numero 32, bandiera e ritaglio di Luca sono quelli del sito. -->
<style>
@font-face{font-family:"Unbounded";src:url(../public/fonts/unbounded.woff) format("woff");font-weight:500 900}
@font-face{font-family:"Barlow";src:url(../public/fonts/barlow-500.woff) format("woff");font-weight:500}
@font-face{font-family:"Barlow";src:url(../public/fonts/barlow-600.woff) format("woff");font-weight:600}
@font-face{font-family:"Barlow Condensed";src:url(../public/fonts/barlowcondensed-600.woff) format("woff");font-weight:600}
@font-face{font-family:"Barlow Condensed";src:url(../public/fonts/barlowcondensed-700.woff) format("woff");font-weight:700}
@font-face{font-family:"Barlow Condensed";src:url(../public/fonts/barlowcondensed-700i.woff) format("woff");font-weight:700;font-style:italic}

:root{
  --asfalto:#0a0b0d; --testo:#f3f3ee; --muto:#a2a6ad;
  --fluo:#e4ff1e; --arancio:#f26f21; --arancio-chiaro:#ff9a3d; --arancio-scuro:#b8420d;
  --inchiostro:#0b0c0e;
  --f-d:"Unbounded",Impact,sans-serif; --f-c:"Barlow Condensed","Arial Narrow",sans-serif; --f-b:"Barlow",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{display:flex;flex-direction:column;gap:40px;padding:40px;width:max-content}

/* misura carta di credito 85,6 x 54 mm: 1011 x 638 */
.card{position:relative;width:1011px;height:638px;border-radius:38px;overflow:hidden;isolation:isolate;color:var(--testo)}

/* ============ FRONTE ============ */
#fronte{background:linear-gradient(160deg,#1c110a 0%,#0d0907 52%,var(--asfalto) 100%)}
#fronte .glow{position:absolute;inset:0;z-index:-3;background:radial-gradient(52% 88% at 76% 42%,rgba(255,122,40,.42),rgba(242,111,33,.12) 55%,transparent 82%)}
#fronte .lines{position:absolute;inset:0;z-index:-2;background:repeating-linear-gradient(-32deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px)}
/* taglio diagonale giallo e nero, come sui bordi della bandiera */
#fronte .slash{position:absolute;z-index:-1;top:-30px;left:572px;width:20px;height:720px;background:var(--fluo);transform:skewX(-24deg)}
#fronte .slash2{position:absolute;z-index:-1;top:-30px;left:604px;width:7px;height:720px;background:var(--fluo);opacity:.55;transform:skewX(-24deg)}

#fronte .mark{position:absolute;left:62px;top:54px;display:flex;align-items:center;gap:16px;font:700 italic 27px/1 var(--f-c);letter-spacing:.02em;color:#d9dce1}
#fronte .mark svg{width:34px;height:34px}
#fronte .t1{position:absolute;left:58px;top:112px;font:900 112px/.84 var(--f-d);text-transform:uppercase;letter-spacing:-.055em;color:var(--fluo)}
#fronte .t2{position:absolute;left:62px;top:322px;font:800 33px/1 var(--f-d);text-transform:uppercase;letter-spacing:-.035em;color:#fff}
#fronte .t3{position:absolute;left:62px;top:372px;font:700 italic 30px/1 var(--f-c);letter-spacing:.015em;color:var(--arancio-chiaro)}
/* targhetta del socio: il nome si scrive qui (sul sito sopra l'immagine, qui resta vuota) */
#fronte .plate{position:absolute;left:62px;top:452px;width:390px;height:92px;border:2.5px solid rgba(228,255,30,.85);border-radius:18px;background:rgba(0,0,0,.4)}
#fronte .plate b{position:absolute;left:22px;top:-15px;padding:0 12px;background:#0d0907;font:700 italic 25px/30px var(--f-c);letter-spacing:.04em;color:var(--fluo)}
#fronte .anno{position:absolute;left:62px;top:566px;font:700 italic 27px/1 var(--f-c);letter-spacing:.04em;color:var(--muto)}

#fronte .flag{position:absolute;left:566px;top:76px;width:402px;transform:rotate(-2.4deg);transform-origin:0 50%;filter:drop-shadow(0 22px 26px rgba(28,8,0,.6))}
#fronte .flag img{display:block;width:100%;height:auto}
#fronte .luca{position:absolute;left:572px;top:66px;height:742px;width:auto;filter:drop-shadow(0 0 1.5px rgba(255,206,160,.85)) drop-shadow(0 0 28px rgba(255,122,40,.45))}
#fronte .fade{position:absolute;left:0;right:0;bottom:0;height:150px;z-index:1;background:linear-gradient(0deg,rgba(10,11,13,.96) 0,rgba(10,11,13,0) 100%)}

/* ============ RETRO ============ */
#retro{background:linear-gradient(135deg,var(--arancio-chiaro) 0%,var(--arancio) 48%,var(--arancio-scuro) 100%);color:var(--inchiostro)}
#retro .lines{position:absolute;inset:0;z-index:-2;background:repeating-linear-gradient(-32deg,rgba(255,255,255,.08) 0 2px,transparent 2px 22px)}
#retro .glow{position:absolute;inset:0;z-index:-3;background:radial-gradient(60% 80% at 50% 46%,rgba(255,208,137,.5),rgba(255,176,96,.14) 55%,transparent 100%)}
#retro .shade1{position:absolute;z-index:-1;left:-210px;top:-40px;width:240px;height:760px;background:#7a2a06;opacity:.26;transform:skewX(-24deg)}
#retro .shade2{position:absolute;z-index:-1;left:720px;top:-40px;width:150px;height:760px;background:#7a2a06;opacity:.24;transform:skewX(-24deg)}
#retro .slash{position:absolute;z-index:-1;right:-22px;bottom:-40px;width:118px;height:292px;background:var(--fluo);clip-path:polygon(100% 0,100% 100%,0 100%)}
#retro .slash::after{content:"";position:absolute;inset:0;background:var(--inchiostro);opacity:.82;clip-path:polygon(100% 22%,100% 30%,22% 100%,0 100%)}

/* banda nera in alto, con le cinque luci di partenza */
#retro .band{position:absolute;left:0;right:0;top:50px;height:124px;background:var(--inchiostro);display:flex;align-items:center;justify-content:space-between;padding:0 54px 0 62px}
#retro .band .nome{font:900 40px/.98 var(--f-d);text-transform:uppercase;letter-spacing:-.04em;color:var(--fluo)}
#retro .band .nome small{display:block;margin-top:9px;font:700 italic 27px/1 var(--f-c);letter-spacing:.03em;text-transform:none;color:#d9dce1}
#retro .lights{display:flex;gap:12px}
#retro .lt{display:grid;gap:9px}
#retro .lt i{display:block;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ff8a7e,#ff2a1c 48%,#b10f06);box-shadow:inset 0 0 0 3px #15171b,0 0 16px 3px rgba(255,42,28,.45)}

#retro .dati{position:absolute;left:62px;top:210px;width:560px;display:grid;gap:0}
#retro .dati div{display:grid;grid-template-columns:150px 1fr;align-items:baseline;gap:18px;padding:11px 0 10px;border-bottom:2px solid rgba(11,12,14,.28)}
#retro .dati dt{font:700 italic 27px/1.1 var(--f-c);letter-spacing:.02em;color:rgba(11,12,14,.72)}
#retro .dati dd{font:600 29px/1.15 var(--f-b);color:var(--inchiostro)}
#retro .dati div:first-child{border-top:2.5px solid var(--inchiostro)}

#retro .n32{position:absolute;right:64px;top:222px;width:262px;height:auto;opacity:.92}
#retro .firma{position:absolute;left:62px;top:530px;width:420px}
#retro .firma span{display:block;border-top:2.5px solid var(--inchiostro);padding-top:8px;font:700 italic 25px/1 var(--f-c);letter-spacing:.04em;color:rgba(11,12,14,.78)}
#retro .forza{position:absolute;right:128px;top:520px;font:900 36px/.95 var(--f-d);text-transform:uppercase;letter-spacing:-.04em;text-align:right;color:var(--inchiostro)}
</style>
</head>
<body>

<section class="card" id="fronte" aria-label="Fronte della tessera">
  <div class="glow"></div><div class="lines"></div><div class="slash"></div><div class="slash2"></div>
  <div class="mark">
    <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="4" y="3" width="2.4" height="22" rx="1.2" fill="#e4ff1e"/><rect x="9" y="5" width="3.2" height="13" rx="1.6" fill="#fff"/><rect x="13.4" y="5" width="3.2" height="13" rx="1.6" fill="#fff"/><rect x="17.8" y="5" width="3.2" height="13" rx="1.6" fill="#fff"/><rect x="22.2" y="5" width="3.2" height="13" rx="1.6" fill="#fff"/></svg>
    Tessera del Fan Club
  </div>
  <div class="t1">Fan<br>Club</div>
  <div class="t2">Luca Lunetta</div>
  <div class="t3">Moto2 · BETA Tools SpeedRS Team</div>
  <div class="plate"><b>Socio</b></div>
  <div class="anno">Stagione 2026</div>
  <div class="flag"><img src="../public/img/bandiera-fanclub-arancio.svg" alt=""></div>
  <img class="luca" src="../public/img/luca-hero.webp" alt="">
  <div class="fade"></div>
</section>

<section class="card" id="retro" aria-label="Retro della tessera">
  <div class="glow"></div><div class="lines"></div><div class="shade1"></div><div class="shade2"></div><div class="slash"></div>
  <div class="band">
    <div class="nome">Fan Club<small>Luca Lunetta #32</small></div>
    <div class="lights" aria-hidden="true">
      <span class="lt"><i></i><i></i></span><span class="lt"><i></i><i></i></span><span class="lt"><i></i><i></i></span><span class="lt"><i></i><i></i></span><span class="lt"><i></i><i></i></span>
    </div>
  </div>
  <dl class="dati">
    <div><dt>Pilota</dt><dd>Luca Lunetta, Moto2</dd></div>
    <div><dt>Numero</dt><dd>32</dd></div>
    <div><dt>Team</dt><dd>BETA Tools SpeedRS Team</dd></div>
    <div><dt>Nato a</dt><dd>Roma, 27 maggio 2006</dd></div>
    <div><dt>Instagram</dt><dd>@lucalunetta58</dd></div>
  </dl>
  <svg class="n32" viewBox="0 0 866 519" aria-hidden="true"><path fill="#0b0c0e" d="M0.0 0.0 L386.0 0.0 L386.0 186.0 L315.0 230.0 L386.0 245.0 L386.0 519.0 L0.0 519.0 L0.0 424.0 L215.0 424.0 L215.0 334.0 L71.0 334.0 L71.0 219.0 L151.0 219.0 L205.0 166.0 L205.0 120.0 L0.0 120.0Z M432.0 0.0 L863.0 0.0 L861.0 163.0 L807.0 214.0 L861.0 218.0 L743.0 321.0 L585.0 323.0 L585.0 418.0 L863.0 418.0 L866.0 519.0 L436.0 519.0 L438.0 280.0 L506.0 218.0 L624.0 218.0 L708.0 152.0 L708.0 117.0 L432.0 117.0Z"/></svg>
  <div class="firma"><span>Firma del socio</span></div>
  <div class="forza">Forza<br>Luca!</div>
</section>

</body>
</html>
